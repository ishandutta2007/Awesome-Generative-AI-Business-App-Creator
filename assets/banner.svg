<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes particleFade {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.8; }
      }

      .floating-node-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
      .glow-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .animated-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
      .particle { animation: particleFade 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Background Animated Glowing Orbs (Behind elements) -->
  <circle cx="200" cy="120" r="140" fill="url(#accent-glow)" class="glow-pulse" />
  <circle cx="1000" cy="300" r="160" fill="url(#accent-glow)" class="glow-pulse" style="animation-delay: -2s;" />

  <!-- Animated Data Connection Streams (Background graphic flows) -->
  <g opacity="0.25">
    <path d="M 100 210 Q 300 80 600 210 T 1100 210" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-stream" />
    <path d="M 100 250 Q 400 360 700 210 T 1100 150" fill="none" stroke="#a855f7" stroke-width="2" class="animated-stream" style="animation-duration: 3s;" />
  </g>

  <!-- Side Floating Flow Nodes / Cards (Kept to sides so text stays clear) -->
  <!-- Left Graphic Node -->
  <g class="floating-node-1" transform="translate(60, 60)" opacity="0.85">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="24" cy="30" r="12" fill="#0284c7" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">RAG Pipeline</text>
    <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Vector Engine</text>
  </g>

  <g class="floating-node-2" transform="translate(40, 280)" opacity="0.85">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="24" cy="30" r="12" fill="#7c3aed" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">🤖</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Agentic Flow</text>
    <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Autonomous AI</text>
  </g>

  <!-- Right Graphic Node -->
  <g class="floating-node-2" transform="translate(980, 70)" opacity="0.85">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="24" cy="30" r="12" fill="#4f46e5" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">📱</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">App Creator</text>
    <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Natural Language</text>
  </g>

  <g class="floating-node-1" transform="translate(990, 270)" opacity="0.85">
    <rect x="0" y="0" width="160" height="60" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="24" cy="30" r="12" fill="#059669" />
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">🔓</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Open Source</text>
    <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Self-Hosted Stacks</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always crisp, top layer) -->
  <!-- Top Category Tag Pill -->
  <g transform="translate(600, 100)" filter="url(#shadow)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="1">
      🧠 ENTERPRISE GENAI ECOSYSTEM 🏢
    </text>
  </g>

  <!-- Main Banner Title -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#text-grad)" text-anchor="middle" filter="url(#shadow)" letter-spacing="-0.5">
    Awesome Generative AI Business App Creator
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" text-anchor="middle" filter="url(#shadow)">
    Commercial SaaS Platforms • Open-Source Frameworks • Agentic Workflows • No-Code AI Builders
  </text>

  <!-- Bottom Badges / Tech Highlights Pill Bar -->
  <g transform="translate(600, 310)">
    <g transform="translate(-240, 0)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600">⚡ Amazon Q Apps</text>
    </g>

    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle" font-weight="600">🎨 Dify &amp; Flowise</text>
    </g>

    <g transform="translate(70, 0)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="600">🔄 n8n &amp; Retool AI</text>
    </g>
  </g>
</svg>
